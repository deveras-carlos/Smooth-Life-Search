[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-life-search"
version = "0.1.0"
description = "2D SmoothLife Search and Adaptive Grid Smooth Life Search with animation export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.scripts]
smooth-life-search = "smooth_life_search.input.cli:main"

[tool.setuptools.packages.find]
include = ["smooth_life_search*"]
